# ── Build Configuration ───────────────────────────────────────────────────

[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10.8.2"
  NODE_ENV = "production"
  CI = "true"
  GENERATE_SOURCEMAP = "false"
  REACT_APP_NAME = "Maniesta Career OS"
  REACT_APP_VERSION = "3.1.3"
  REACT_APP_ENVIRONMENT = "production"
  REACT_APP_ENABLE_ANALYTICS = "true"

  # ── Netlify Secrets Scanning ────────────────────────────────────────────
  # The following REACT_APP_* variables are public client configuration, not
  # secrets. Every REACT_APP_* value is inlined into the browser bundle at
  # build time (that is the CRA convention), and each of these values also
  # appears as a fallback literal in the source tree - e.g. the site URL in
  # `src/config/siteConfig.js`, the app name in `src/data/constants.js`, and
  # the version string in `package.json`. Netlify's secret scanner treats the
  # presence of those values in the repo as a potential leak and fails the
  # build.
  #
  # Listing them here does NOT weaken secret protection. It only tells the
  # scanner to skip these specific keys. Any env var that is a genuine
  # secret MUST NOT use the REACT_APP_ prefix and MUST NOT be added to this
  # list - it belongs in server-side Netlify Function environment variables.
  SECRETS_SCAN_OMIT_KEYS = "REACT_APP_ENVIRONMENT,REACT_APP_NAME,REACT_APP_VERSION,REACT_APP_SUPPORT_EMAIL,REACT_APP_SITE_URL,REACT_APP_RESUME_API_URL"

# ── Redirects ─────────────────────────────────────────────────────────────

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# ── Headers ────────────────────────────────────────────────────────────────

# Security Headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # Content Security Policy - includes Firebase Auth, Firestore, Analytics,
    # Sentry, the pdf.js worker CDN, Stripe.js, and the Google Fonts the
    # service worker fetches.
    #
    # `https://cdnjs.cloudflare.com` is required because
    # `src/utils/resumeParser.js` sets `GlobalWorkerOptions.workerSrc` to
    # `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/<version>/pdf.worker.min.js`.
    # If this domain is removed from `script-src` or `connect-src`, the
    # worker is blocked and every PDF upload into the ATS Scanner fails
    # silently (the parser reports a generic "failed to parse" error).
    #
    # `worker-src 'self' blob:` is required because pdf.js constructs its
    # worker from a `blob:` URL that wraps the downloaded worker script.
    # Without this directive, the browser falls back to `script-src`,
    # `blob:` is rejected, and pdf.js falls back to the "fake worker" -
    # parsing then runs on the main thread and freezes the UI on file
    # upload. The `blob:` entry in `script-src` is a defensive fallback for
    # engines that do not consult `worker-src`.
    #
    # `https://js.stripe.com` is required in `script-src` because the Stripe
    # SDK loader injects `<script src="https://js.stripe.com/v3">`. Without
    # it, every subscription-upgrade action fails with
    # `Failed to load Stripe.js` and the Checkout flow cannot open.
    # `https://api.stripe.com` and `https://js.stripe.com` are also required
    # in `connect-src` for the SDK's follow-up requests.
    #
    # `https://fonts.googleapis.com` and `https://fonts.gstatic.com` are
    # required in `connect-src` because `public/sw.js` intercepts those
    # requests and re-fetches them. The browser's direct font path uses
    # `font-src`, but the service worker's fetch path is governed by
    # `connect-src`. Without these entries the SW returns a synthetic 503
    # for every Inter `.woff2` and the font falls back to the system stack.
    #
    # The Firebase Auth lines (apis.google.com, accounts.google.com,
    # gstatic.com, firebaseapp.com, identitytoolkit, securetoken) are
    # required for Google sign-in to work.
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://*.sentry.io https://www.googletagmanager.com https://*.google-analytics.com https://*.googletagmanager.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://www.googletagservices.com https://*.googleadservices.com https://www.google-analytics.com https://*.g.doubleclick.net https://apis.google.com https://accounts.google.com https://www.gstatic.com https://*.firebaseapp.com https://cdnjs.cloudflare.com https://js.stripe.com;
      worker-src 'self' blob:;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: https: blob: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://*.googlesyndication.com https://*.g.doubleclick.net https://*.googleadservices.com https://*.googleusercontent.com;
      connect-src 'self' https://*.sentry.io https://*.googleapis.com https://*.firebaseio.com https://*.cloudfunctions.net https://*.netlify.app wss://*.firebaseio.com https://www.google-analytics.com https://*.google-analytics.com https://*.g.doubleclick.net https://www.google.com https://stats.g.doubleclick.net https://*.googlesyndication.com https://*.googleadservices.com https://googleads.g.doubleclick.net https://apis.google.com https://accounts.google.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://cdnjs.cloudflare.com https://js.stripe.com https://api.stripe.com https://fonts.googleapis.com https://fonts.gstatic.com;
      frame-src 'self' https://*.firebaseapp.com https://*.stripe.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://*.googlesyndication.com https://apis.google.com https://accounts.google.com;
      media-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    """

# Static assets - long cache
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# JavaScript files
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=UTF-8"

# CSS files
[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css; charset=UTF-8"

# Service Worker - no cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
    Service-Worker-Allowed = "/"

# HTML - no cache for SPA
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

# Font files - cache for 1 year
[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Image files - cache for 1 year
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sitemap
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=UTF-8"

# JSON files (manifest, etc.)
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/json; charset=UTF-8"

# Web App Manifest (single canonical manifest - matches public/manifest.json)
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/manifest+json"